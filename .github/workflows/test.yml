name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: git diff --check

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.3'
      - run: bash scripts/build-app.sh
      - name: Bundled Python tests
        run: build/Fenlet.app/Contents/Resources/runtime/bin/python3 -m unittest discover -v
      - name: Portable install smoke test
        run: python3 scripts/verify-bundle.py build/Fenlet.app
      - run: bash scripts/package.sh build/Fenlet.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fenlet-macos-arm64-unsigned
          path: |
            build/Fenlet-macos-arm64.zip
            build/Fenlet-macos-arm64.zip.sha256
          if-no-files-found: error
